name: Dragon Ball Z Kakarot (HD) FPS Unlocker Build

on:
  push:
    branches: [ main, master ]
    tags:
      - '1.1'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup MinGW-w64
      uses: egor-tensin/setup-mingw@v2
      with:
        platform: x64
        version: latest
        
    - name: Verify MinGW installation
      run: |
        g++ --version
        windres --version
        
    - name: Compile Resource file
      run: |
        windres src/Version.rc -O coff -o Version.o
        
    - name: Compile FPS Unlocker
      run: |
        g++ -shared -O2 -o "FPS Unlocker for DBZK (HD).asi" src/Main.cpp Version.o -lpsapi -static-libgcc -static-libstdc++ -DPSAPI_VERSION=1 -DWIN32_LEAN_AND_MEAN -DNOMINMAX
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: FPS-Unlocker-DBZK-HD
        path: FPS Unlocker for DBZK (HD).asi
        retention-days: 30
        
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: FPS Unlocker for DBZK (HD).asi
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
