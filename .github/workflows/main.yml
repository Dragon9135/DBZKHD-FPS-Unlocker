name: Build FPS Unlocker

on:
  push:
    branches: [ main, master ]
    tags:
      - '*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      
    - name: Setup MSYS2 and MinGW-w64
      uses: msys2/setup-msys2@v2
      with:
        msystem: mingw64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-binutils
          
    - name: Compile Resource file
      shell: msys2 {0}
      run: |
        cd "$GITHUB_WORKSPACE"
        windres Version.rc -O coff -o Version.o
        
    - name: Compile FPS Unlocker
      shell: msys2 {0}
      run: |
        cd "$GITHUB_WORKSPACE"
        g++ -shared -O2 -o "FPS Unlocker for DBZK (HD).asi" Main.cpp Version.o -lpsapi -luser32 -static -static-libgcc -static-libstdc++ -DPSAPI_VERSION=1 -DWIN32_LEAN_AND_MEAN -DNOMINMAX
        
    - name: Upload artifact
      uses: actions/upload-artifact@v6
      with:
        name: FPS-Unlocker-DBZK-HD
        path: FPS Unlocker for DBZK (HD).asi
        retention-days: 30
        
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: FPS Unlocker for DBZK (HD).asi
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
